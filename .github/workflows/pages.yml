name: Publish the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # older menu revisions come from git history
      - name: Read the pinned plugin commit
        id: lock
        run: echo "ref=$(jq -r .ref plugin.lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: peppy6582/jellydisc
          ref: ${{ steps.lock.outputs.ref }}
          path: plugin
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install jsonschema
      - name: Build the catalogue (checks every menu first)
        run: python3 tools/build_index.py --plugin plugin --out _catalogue
      - run: npm ci --no-audit --no-fund
      - name: Build the site and its search index
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
